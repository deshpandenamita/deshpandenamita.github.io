<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videos – MoneyMap</title>
<meta name="description" content="Short narrated videos that explain compound interest, stock prices, diversification, and index funds.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%23ff6b6b%27/%3E%3Cstop offset=%271%27 stop-color=%27%236c5ce7%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2732%27 height=%2732%27 rx=%2710%27 fill=%27url(%23g)%27/%3E%3Cpath d=%27M7 22l6-7 4 4 8-9%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272.6%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="videos">
<main class="wrap">
  <section class="page-hero">
    <div class="hero-bg" aria-hidden="true"></div>
    <span class="eyebrow">About 90 seconds each · Captions included</span>
    <h1>Watch and learn</h1>
    <p class="lead">Short narrated videos for the trickiest ideas. Turn on captions with the CC button, and pair each video with its lesson.</p>
  </section>
  <section style="margin-top:28px">
    <div class="video-grid" id="vids"></div>
  </section>
</main>
<script src="js/common.js"></script>
<script src="js/game.js"></script>
<script src="js/lessons-1.js"></script>
<script src="js/lessons-2.js"></script>
<script src="js/videos.js"></script>
<script>
(function () {
  const L = Object.fromEntries((window.LESSONS || []).map((l) => [l.id, l]));
  document.getElementById('vids').innerHTML = window.VIDEO_LIBRARY.map((v, k) => {
    const l = L[v.lesson];
    return `<article class="card video-card tone-${v.tone}">
      <div class="video-frame"><video controls preload="none" poster="videos/${v.slug}-poster.jpg" src="videos/${v.slug}.mp4">
        <track kind="captions" srclang="en" label="English" src="videos/${v.slug}.vtt"></video></div>
      <div class="vc-body">
        <small>Video ${k + 1}</small>
        <h3>${MM.esc(v.title)}</h3>
        <p class="muted">${MM.esc(v.blurb)}</p>
        ${l ? `<a class="btn sm" href="learn.html#${l.id}">Read the lesson: ${MM.esc(l.title)} →</a>` : ''}
      </div></article>`;
  }).join('');
  document.querySelectorAll('video').forEach((vid) => vid.addEventListener('play', () => {
    document.querySelectorAll('video').forEach((o) => { if (o !== vid) o.pause(); });
    const seen = MM.load('watched', {}); seen[vid.getAttribute('src')] = true; MM.save('watched', seen);
  }));
})();
</script>
</body>
</html>
